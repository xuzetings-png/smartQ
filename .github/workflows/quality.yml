name: 质量门禁

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: 设置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.2
          run_install: false

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行统一质量门禁
        run: pnpm quality
